<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Parcel Cropper</title>
  <meta name="description" content="Beskär PostNord-fraktsedeln till en 104,4 × 187,8 mm-etikett direkt i webbläsaren.">
  <link rel="stylesheet" href="styles.css?v=1785746473">
</head>
<body>
  <main>
    <header class="topbar">
      <span class="brand">Parcel Cropper</span>
      <ol class="steps">
        <li data-step="1">Ladda upp</li>
        <li data-step="2">Rotera &amp; markera</li>
        <li data-step="3">Resultat</li>
      </ol>
      <div class="nav">
        <button id="backButton" type="button" hidden>Tillbaka</button>
        <button id="nextButton" class="primary" type="button" hidden>Nästa</button>
      </div>
    </header>

    <section id="panelUpload" class="panel">
      <label id="dropZone" class="drop" for="fileInput">
        <input id="fileInput" type="file" accept="application/pdf,.pdf" hidden>
        <span>Välj eller släpp en PDF-fraktsedel</span>
      </label>
    </section>

    <section id="panelEdit" class="panel" hidden>
      <div class="tools">
        <button id="rotateLeftButton" class="tb-btn" type="button" aria-label="Rotera vänster" title="Rotera vänster">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
        </button>
        <button id="rotateRightButton" class="tb-btn" type="button" aria-label="Rotera höger" title="Rotera höger">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        </button>
        <span class="sep"></span>
        <button id="zoomOutButton" class="tb-btn" type="button" aria-label="Zooma ut" title="Zooma ut">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
        <button id="zoomInButton" class="tb-btn" type="button" aria-label="Zooma in" title="Zooma in">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
        <span class="sep"></span>
        <button id="resetButton" class="tb-btn" type="button" aria-label="Återställ" title="Återställ">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        </button>
        <span class="sep"></span>
        <span class="tb-size">
          <input id="ow2" class="tb-input" type="number" min="20" max="500" step="0.1" aria-label="Bredd i mm">
          <span class="tb-x">×</span>
          <input id="oh2" class="tb-input" type="number" min="20" max="1000" step="0.1" aria-label="Höjd i mm">
          <span class="tb-unit">mm</span>
        </span>
      </div>
      <div id="preview" class="viewport">
        <div id="pageStage" class="stage">
          <canvas id="pdfCanvas" aria-label="Förhandsvisning"></canvas>
          <div id="selection" class="selection" tabindex="0" aria-label="Beskärningsområde">
            <button class="handle nw" data-handle="nw" type="button" aria-label="Övre vänstra hörnet"></button>
            <button class="handle n" data-handle="n" type="button" aria-label="Överkant"></button>
            <button class="handle ne" data-handle="ne" type="button" aria-label="Övre högra hörnet"></button>
            <button class="handle e" data-handle="e" type="button" aria-label="Högerkant"></button>
            <button class="handle se" data-handle="se" type="button" aria-label="Nedre högra hörnet"></button>
            <button class="handle s" data-handle="s" type="button" aria-label="Underkant"></button>
            <button class="handle sw" data-handle="sw" type="button" aria-label="Nedre vänstra hörnet"></button>
            <button class="handle w" data-handle="w" type="button" aria-label="Vänsterkant"></button>
          </div>
          <div id="shadeTop" class="shade"></div>
          <div id="shadeRight" class="shade"></div>
          <div id="shadeBottom" class="shade"></div>
          <div id="shadeLeft" class="shade"></div>
        </div>
      </div>
    </section>

    <section id="panelDownload" class="panel" hidden>
      <div class="tools">
        <span class="tb-size">
          <input id="ow3" class="tb-input" type="number" readonly tabindex="-1" aria-label="Bredd i mm">
          <span class="tb-x">×</span>
          <input id="oh3" class="tb-input" type="number" readonly tabindex="-1" aria-label="Höjd i mm">
          <span class="tb-unit">mm</span>
        </span>
      </div>
      <div id="resultPreview" class="viewport result">
        <canvas id="resultCanvas" aria-label="Färdig etikett"></canvas>
      </div>
    </section>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <footer class="footer">© 2026 Carlboms Data · Allt sker lokalt i din webbläsare – inget laddas upp eller sparas.</footer>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="app.js?v=1785746473"></script>
</body>
</html>
